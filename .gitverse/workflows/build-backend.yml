
name: Build ASP.NET Backend

on:
  push:
    branches: [main, master]
    paths:
      - 'sport-app-server/**'
      - '.gitverse/workflows/build-backend.yml'
  pull_request:
    paths:
      - 'sport-app-server/**'
      - '.gitverse/workflows/build-backend.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./sport-app-server

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('sport-app-server/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish sport-app-server/sport-app-server.csproj --configuration Release --no-restore --output ./publish

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sport-app-server
          path: sport-app-server/publish/
          if-no-files-found: error