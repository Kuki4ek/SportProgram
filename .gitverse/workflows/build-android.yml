name: Build Android

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sport-app-android/**'
      - '.gitverse/workflows/build-android.yml'
  pull_request:
    paths:
      - 'sport-app-android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sport-app-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Устанавливаем Gradle (setup-gradle сам скачает нужную версию)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'   # при необходимости поменяй на нужную версию

      # Если используешь gradle-wrapper.jar — regenerated wrapper под нужную версию
      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug