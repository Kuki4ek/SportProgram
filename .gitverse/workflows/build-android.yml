name: Build Android

on:
  push:
    branches: [ main, master ]
    paths:
      - 'sport-app-android/**'
      - '.gitverse/workflows/build-android.yml'
  pull_request:
    paths:
      - 'sport-app-android/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sport-app-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Устанавливаем Gradle вручную (без gradle/actions/setup-gradle)
      - name: Install Gradle
        run: |
          GRADLE_VERSION=8.9
          wget -q https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
          unzip -q gradle-${GRADLE_VERSION}-bin.zip -d /opt
          echo "/opt/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
          /opt/gradle-${GRADLE_VERSION}/bin/gradle --version

      # Если в репо нет gradle-wrapper.jar — пересоздаём wrapper
      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Set up Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew assembleDebug