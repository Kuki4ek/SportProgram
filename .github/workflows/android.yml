name: Android CI

on:
  push:
    branches: [ "master" ]
    paths:
    - 'sport-app-android/**'
    - '.github/workflows/android.yml'
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sport-app-android

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_HOME" ]; then
            for candidate in \
              "$HOME/Android/Sdk" \
              "$HOME/android-sdk" \
              "/opt/android-sdk" \
              "/usr/local/lib/android/sdk" \
              "/usr/lib/android-sdk"; do
              if [ -d "$candidate" ]; then
                ANDROID_HOME="$candidate"
                break
              fi
            done
          fi
          if [ -z "$ANDROID_HOME" ]; then
            ANDROID_HOME="$RUNNER_TEMP/android-sdk"
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            cd "$RUNNER_TEMP"
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O commandline-tools.zip
            unzip -q commandline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
            mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          test -d "$ANDROID_HOME" || { echo "Android SDK was not found or installed"; exit 1; }
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -perm -u+x 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"

          echo "Available Android platform packages:"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --list \
            | grep -E 'platforms;android-[0-9]+' \
            | head -n 50 || true

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-37.2" \
            "build-tools;36.0.0"

      - name: Configure Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME/platform-tools"
          test -d "$ANDROID_HOME/platforms/android-37.2"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          echo "Android SDK is ready at $ANDROID_HOME"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug and Release APKs
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sport-app-debug-apk
          path: sport-app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sport-app-release-apk
          path: sport-app-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

      - name: Release APKs 
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sport-app-android/app/build/outputs/apk/debug/app-debug.apk
            sport-app-android/app/build/outputs/apk/release/app-release.apk
          tag_name: latest
          name: Latest Master Build
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
