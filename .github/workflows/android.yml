name: Android CI

on:
  push:
    branches: [master]
    paths:
      - 'sport-app-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'sport-app-android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sport-app-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Run lint
        run: ./gradlew --no-daemon lint

      - name: Run unit tests
        run: ./gradlew --no-daemon test

  build-debug:
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: ./sport-app-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sport-app-debug-apk
          path: sport-app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  build-release:
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: ./sport-app-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Build Release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sport-app-release-apk
          path: sport-app-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v7.0.2
        with:
          name: sport-app-debug-apk
          path: ./artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v7.0.2
        with:
          name: sport-app-release-apk
          path: ./artifacts/release

      - name: Release APKs
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/debug/app-debug.apk
            ./artifacts/release/app-release-unsigned.apk
          tag_name: latest
          name: Latest Master Build
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
