name: Android CI

on:
  push:
    branches: [master]
    paths:
      - 'sport-app-android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [master]
    paths:
      - 'sport-app-android/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./sport-app-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Run lint
        run: ./gradlew --no-daemon lint

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      - name: Push test results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-results-html
          path: /home/runner/work/SportProgram/SportProgram/sport-app-android/app/build/reports/tests/testReleaseUnitTest/index.html
          if-no-files-found: warn

  build-debug:
    runs-on: ubuntu-latest
    needs: checks
    defaults:
      run:
        working-directory: ./sport-app-android
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup Android
        uses: ./.github/actions/setup-android

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7.0.2
        with:
          name: sport-app-debug-apk
          path: sport-app-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [build-debug]
    permissions:
      contents: write
    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v8.0.2
        with:
          name: sport-app-debug-apk
          path: ./artifacts/debug

      - name: Generate build tag
        id: build-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +%Y%m%d)
          MAX=$(gh api "repos/${{ github.repository }}/git/matching-refs/tags/${DATE}" \
            --jq '.[].ref' 2>/dev/null \
            | grep -oP "${DATE}\K\d+" \
            | sort -n \
            | tail -n 1)

          if [ -z "$MAX" ]; then
            COUNT="01"
          else
            COUNT=$(printf "%02d" $((10#$MAX + 1)))
          fi

          echo "tag=${DATE}${COUNT}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          echo "num=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "Generated tag: ${DATE}${COUNT}"

      - name: Release APKs
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            ./artifacts/debug/app-debug.apk
          tag_name: ${{ steps.build-tag.outputs.tag }}
          name: Релиз № ${{ steps.build-tag.outputs.num }} от ${{ steps.build-tag.outputs.date }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
